<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />

    <title>Andrew Barrett</title>
    <meta name="description" content="Founding forward deployed engineer at Poetic." />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />

    <link
      rel="preload"
      href="/fonts/geist-mono-latin-wght-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/geist-latin-wght-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Andrew Barrett" />
    <meta property="og:title" content="Andrew Barrett" />
    <meta property="og:description" content="Founding forward deployed engineer at Poetic." />
    <meta property="og:url" content="https://abarrett.io/" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Andrew Barrett" />
    <meta name="twitter:description" content="Founding forward deployed engineer at Poetic." />

    <!-- ?v= is stamped with the commit SHA at deploy. Without it a cached
         main.js can pair with fresh markup and behave like a different app. -->
    <link rel="stylesheet" href="/styles.css?v=__V__" />

    <script>
      // Resolve the theme before first paint so there is no flash.
      (function () {
        try {
          /*
           * Switching theme is a keyboard action (press T), so devices with
           * no keyboard have no way to reach it — those stay locked to dark.
           * An explicit ?theme= in the URL still wins, for testing.
           */
          var coarse =
            window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
          var q = new URLSearchParams(window.location.search).get('theme');
          var t;

          if (q === 'light' || q === 'dark') {
            t = q;
          } else if (coarse) {
            t = 'dark';
          } else {
            t = localStorage.getItem('theme');
            if (t !== 'light' && t !== 'dark') t = 'dark';
          }

          document.documentElement.setAttribute('data-theme', t);
          if (!coarse) {
            try {
              localStorage.setItem('theme', t);
            } catch (_) {}
          }
        } catch (_) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
  </head>

  <body>
    <main class="stage">
      <div class="column">
        <div class="mark reveal" style="--delay: 0ms">
          <canvas
            id="ink"
            class="ink"
            role="button"
            tabindex="0"
            aria-label="Ink field — tap to swirl the streams"
          ></canvas>
        </div>

        <div class="bio">
          <h1 class="name reveal" style="--delay: 90ms">Andrew Barrett</h1>
          <p class="line reveal" style="--delay: 150ms">
            Founding FDE at
            <a class="inline-link" href="https://poetic.com" target="_blank" rel="noopener noreferrer"
              >Poetic</a
            >.
          </p>
        </div>

        <nav class="links reveal" style="--delay: 220ms" aria-label="Elsewhere">
          <a
            class="link"
            href="https://github.com/AppleDev879"
            target="_blank"
            rel="noopener noreferrer"
            >GitHub</a
          >
          <span class="sep" aria-hidden="true">/</span>
          <a
            class="link"
            href="https://www.linkedin.com/in/andrewbarrett2/"
            target="_blank"
            rel="noopener noreferrer"
            >LinkedIn</a
          >
          <span class="sep" aria-hidden="true">/</span>
          <a
            class="link"
            href="https://x.com/abarrett879"
            target="_blank"
            rel="noopener noreferrer"
            >X</a
          >
        </nav>
      </div>
    </main>

    <script src="/main.js?v=__V__"></script>
  </body>
</html>
