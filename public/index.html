<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />

    <title>Andrew Barrett</title>
    <meta name="description" content="Founding forward deployed engineer at Poetic." />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />

    <link
      rel="preload"
      href="/fonts/geist-mono-latin-wght-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/geist-latin-wght-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Andrew Barrett" />
    <meta property="og:title" content="Andrew Barrett" />
    <meta property="og:description" content="Founding forward deployed engineer at Poetic." />
    <meta property="og:url" content="https://abarrett.io/" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Andrew Barrett" />
    <meta name="twitter:description" content="Founding forward deployed engineer at Poetic." />

    <link rel="stylesheet" href="/styles.css" />

    <script>
      // Resolve the theme before first paint so there is no flash.
      (function () {
        try {
          var q = new URLSearchParams(window.location.search).get('theme');
          var t = q === 'light' || q === 'dark' ? q : localStorage.getItem('theme');
          if (t !== 'light' && t !== 'dark') t = 'dark';
          document.documentElement.setAttribute('data-theme', t);
          try {
            localStorage.setItem('theme', t);
          } catch (_) {}
        } catch (_) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
  </head>

  <body>
    <button
      id="theme-toggle"
      class="theme-toggle"
      type="button"
      aria-label="Switch to light theme"
    >
      <!-- Crescent as a disc with an offset disc masked out, so its
           thinness is a matter of moving one circle. -->
      <svg viewBox="0 0 24 24" width="17" height="17" aria-hidden="true" focusable="false">
        <mask id="moon-cut">
          <rect width="24" height="24" fill="black" />
          <circle cx="12" cy="12" r="9" fill="white" />
          <circle cx="16.4" cy="9.2" r="8.6" fill="black" />
        </mask>
        <circle cx="12" cy="12" r="9" fill="currentColor" mask="url(#moon-cut)" />
      </svg>
    </button>

    <main class="stage">
      <div class="column">
        <div class="mark reveal" style="--delay: 0ms">
          <canvas
            id="ink"
            class="ink"
            role="button"
            tabindex="0"
            aria-label="Ink field — tap to swirl the streams"
          ></canvas>
        </div>

        <div class="bio">
          <h1 class="name reveal" style="--delay: 90ms">Andrew Barrett</h1>
          <p class="line reveal" style="--delay: 150ms">
            Founding FDE at
            <a class="inline-link" href="https://poetic.com" target="_blank" rel="noopener noreferrer"
              >Poetic</a
            >.
          </p>
        </div>

        <nav class="links reveal" style="--delay: 220ms" aria-label="Elsewhere">
          <a
            class="link"
            href="https://github.com/AppleDev879"
            target="_blank"
            rel="noopener noreferrer"
            >GitHub</a
          >
          <span class="sep" aria-hidden="true">/</span>
          <a
            class="link"
            href="https://www.linkedin.com/in/andrewbarrett2/"
            target="_blank"
            rel="noopener noreferrer"
            >LinkedIn</a
          >
          <span class="sep" aria-hidden="true">/</span>
          <a
            class="link"
            href="https://x.com/abarrett879"
            target="_blank"
            rel="noopener noreferrer"
            >X</a
          >
        </nav>
      </div>
    </main>

    <script src="/main.js"></script>
  </body>
</html>
