name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; always finish the newest.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      # Stamp asset URLs with the commit SHA. Cloudflare caches styles.css
      # and main.js for 10 minutes, so without this a visitor can end up
      # running a stale script against fresh markup.
      - name: Version asset URLs
        run: sed -i "s/__V__/${GITHUB_SHA::12}/g" public/index.html

      # The site is already static — public/ ships as-is, no build step.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - id: deploy
        uses: actions/deploy-pages@v4
